name = "arxiv-api"
main = "src/api-worker/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[[kv_namespaces]]
binding = "CACHE"
id = "ed3c323de9cc48a4b332beec939597a4"

[[d1_databases]]
binding = "DB"
database_name = "arxiv-explorer"
database_id = "67fa825b-9f3e-478c-99d2-3e5cc1b0f3de"

[[vectorize]]
binding = "VECTORIZE"
index_name = "arxiv-papers"

[ai]
binding = "AI"

# Native Workers Rate Limiting binding — backed by the same infra as
# Cloudflare's WAF rate-limiting rules, NOT KV. Used as a first line of
# defense that keeps working even when the KV-backed per-route limiter in
# middleware/rate-limit.ts is degraded (KV outage, daily quota exhausted).
# Period must be 10 or 60 seconds (Cloudflare API constraint) — 60 chosen to
# match the existing per-route KV limits for consistent behavior.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
ARXIV_FETCH_CATEGORIES = "cs.LG,cs.CL,cs.CV,stat.ML"
SUMMARY_MODEL = "@cf/meta/llama-3.1-8b-instruct"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
CACHE_TTL_SEARCH_SECONDS = "7200"
CACHE_TTL_TRENDING_SECONDS = "3600"
CACHE_TTL_EMBED_SECONDS = "86400"
ALLOWED_ORIGIN = "https://arxivexplorer.arxivexplorer.workers.dev"

# Set ADMIN_SECRET via: wrangler secret put ADMIN_SECRET --config wrangler.api.toml
# Required for /admin/* endpoints (Vectorize upserts, maintenance)

# INTERNAL_TOKEN authenticates X-Real-IP forwarding from the Next.js worker
# (app/api/classify-claim/route.ts). Set the SAME random value on both workers:
#   wrangler secret put INTERNAL_TOKEN --config wrangler.api.toml
#   wrangler secret put INTERNAL_TOKEN --config wrangler.jsonc
# Optional: when unset, forwarded client IPs are ignored (fail-safe) and proxied
# traffic is bucketed as 'internal'. Without it, /api/classify-claim cannot do
# per-user rate limiting; with a forged header anyone could escape it.
